[package]
name = "cast-core"
version = "1.6.0"
description = "Launcher logic"
edition = "2021"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json", "form", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "process", "rt", "macros"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate", "deflate64"] }
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tiny_http = "0.12"
# for copy modrinth
rusqlite = { version = "0.39", features = ["bundled"] }
png = "0.18"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
