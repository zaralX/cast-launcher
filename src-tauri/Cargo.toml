[workspace]
members = ["core"]

[workspace.lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
debug = false

[package]
name = "cast-launcher"
version = "1.6.0"
description = "Minecraft launcher and modpack manager"
authors = ["zaralX"]
homepage = "https://github.com/zaralX/cast-launcher"
repository = "https://github.com/zaralX/cast-launcher"
license = "Apache-2.0"
edition = "2021"

[lints]
workspace = true

[lib]
# https://github.com/rust-lang/cargo/issues/8519
name = "cast_launcher_lib"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cast-core = { path = "core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "process", "rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-aptabase = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

