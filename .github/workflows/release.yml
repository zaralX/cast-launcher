name: 'publish'

# Releases are started by hand from the Actions tab. The version comes from the
# files in the repo, and the tag is created by GitHub when the draft is published.
on:
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: versions must be in sync
        run: |
          tauri_conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          app=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          core=$(grep -m1 '^version' src-tauri/core/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json=$tauri_conf package.json=$pkg src-tauri/Cargo.toml=$app core/Cargo.toml=$core"
          if [ "$tauri_conf" != "$pkg" ] || [ "$tauri_conf" != "$app" ] || [ "$tauri_conf" != "$core" ]; then
            echo "::error::version mismatch between tauri.conf.json, package.json and the Cargo manifests"
            exit 1
          fi
          echo "### Releasing v$tauri_conf from \`${{ github.ref_name }}\` (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"

      - name: version must not be released yet
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists — bump the version before releasing"
            exit 1
          fi

  publish-launcher:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
#          - platform: 'macos-latest' # for Arm based macs (M1 and above).
#            args: '--target aarch64-apple-darwin'
#          - platform: 'macos-latest' # for Intel based macs.
#            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm' # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          generateReleaseNotes: true
          # The tag is created only when the draft is published, so pin it to the
          # commit that was actually built instead of whatever main points at then.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
