name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that touches only one side skips the other side's jobs. Skipped jobs pass
  # required checks, and a manual run checks everything.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: filter
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$BASE"...HEAD)
          touches() { echo "$files" | grep -qE "$1" && echo true || echo false; }

          # i18n is on both sides: cargo test checks that every key Rust sends exists in the locales.
          echo "rust=$(touches '^(src-tauri/|i18n/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(touches '^(app/|i18n/|public/|package(-lock)?\.json$|nuxt\.config\.ts$|eslint\.config\.mjs$|tsconfig\.json$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ['ubuntu-22.04', 'windows-latest', 'macos-latest']

    steps:
      - uses: actions/checkout@v5

      # cast-core doesn't depend on tauri, so no webkit/appindicator deps needed here.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: cargo test (cast-core)
        working-directory: ./src-tauri
        run: cargo test -p cast-core --locked

  build:
    name: build (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ['ubuntu-22.04', 'windows-latest', 'macos-latest']

    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      # tauri-build validates that frontendDist exists, so the frontend has to be
      # generated before cargo touches the app crate.
      - name: build frontend
        run: npm run generate

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      # clippy type-checks everything cargo check does, plus the workspace lints from Cargo.toml.
      - name: cargo clippy (workspace)
        working-directory: ./src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: frontend (eslint, typecheck, generate)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      # postinstall runs `nuxt prepare`, which generates .nuxt/eslint.config.mjs and the tsconfigs.
      - name: install frontend dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # The build jobs skip a frontend-only pull request, so the static build is checked here.
      - name: generate
        run: npm run generate

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        working-directory: ./src-tauri
        run: cargo fmt --all --check
