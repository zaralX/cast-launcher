name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ['ubuntu-22.04', 'windows-latest', 'macos-latest']

    steps:
      - uses: actions/checkout@v4

      # cast-core doesn't depend on tauri, so no webkit/appindicator deps needed here.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: cargo test (cast-core)
        working-directory: ./src-tauri
        run: cargo test -p cast-core --locked

  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ['ubuntu-22.04', 'windows-latest', 'macos-latest']

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      # tauri-build validates that frontendDist exists, so the frontend has to be
      # generated before cargo touches the app crate.
      - name: build frontend
        run: npm run generate

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      # clippy type-checks everything cargo check does, plus the workspace lints from Cargo.toml.
      - name: cargo clippy (workspace)
        working-directory: ./src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: frontend (eslint, typecheck)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # postinstall runs `nuxt prepare`, which generates .nuxt/eslint.config.mjs and the tsconfigs.
      - name: install frontend dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        working-directory: ./src-tauri
        run: cargo fmt --all --check
